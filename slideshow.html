
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Photo Slideshow</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Raleway:wght@200;300&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: #0a0a0a;
    overflow: hidden;
    font-family: 'Raleway', sans-serif;
  }

  #slideshow {
    position: fixed;
    inset: 0;
    background: #0a0a0a;
  }

  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: opacity;
  }

  .slide.active   { opacity: 1; z-index: 2; }
  .slide.previous { opacity: 0; z-index: 1; }

  /* ── BLURRED BACKGROUND LAYER ── */
  .slide-bg {
    position: absolute;
    inset: -40px; /* oversized so blur doesn't show edges */
    background-size: cover;
    background-position: center;
    filter: blur(28px) brightness(0.45) saturate(1.2);
    transform: scale(1.05);
    z-index: 0;
  }

  /* ── FOREGROUND PHOTO (full image, contained) ── */
  .slide-img {
    position: absolute;
    inset: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .slide-img img {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    /* subtle drop shadow to lift photo off the blurred bg */
    filter: drop-shadow(0 8px 40px rgba(0,0,0,0.5));
  }

  /* Ken Burns on the background layer only — keeps photo sharp */
  .slide.active .slide-bg {
    animation: kenburns-bg 10s ease-in-out forwards;
  }

  @keyframes kenburns-bg {
    0%   { transform: scale(1.05) translate(0%, 0%); }
    100% { transform: scale(1.12) translate(-1.5%, -1%); }
  }

  .slide:nth-child(even).active .slide-bg {
    animation: kenburns-bg-alt 10s ease-in-out forwards;
  }

  @keyframes kenburns-bg-alt {
    0%   { transform: scale(1.05) translate(0%, 0%); }
    100% { transform: scale(1.12) translate(1.5%, 1%); }
  }

  /* subtle gradient over the whole slide for depth */
  .slide::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to top, rgba(0,0,0,0.35) 0%, transparent 40%),
      linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, transparent 25%);
    z-index: 2;
    pointer-events: none;
  }

  /* ── UI CHROME ── */
  #counter {
    position: fixed;
    bottom: 3.5%;
    right: 5%;
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: clamp(11px, 1vw, 16px);
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.2em;
    z-index: 10;
  }

  #venue-name {
    position: fixed;
    top: 5%;
    right: 5%;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(18px, 1.8vw, 30px);
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.06em;
    z-index: 10;
    text-shadow: 0 1px 10px rgba(0,0,0,0.4);
  }

  #dots {
    position: fixed;
    bottom: 3%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 10;
    flex-wrap: wrap;
    max-width: 80%;
    justify-content: center;
  }

  .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    transition: background 0.4s, transform 0.4s;
    flex-shrink: 0;
  }

  .dot.active {
    background: rgba(255,255,255,0.85);
    transform: scale(1.3);
  }

  #progress-bar {
    position: fixed;
    bottom: 0; left: 0;
    height: 2px;
    background: rgba(255,255,255,0.6);
    z-index: 10;
    width: 0%;
    transition: none;
  }

  /* ── LOADING SCREEN ── */
  #loader {
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 24px;
    transition: opacity 0.8s ease;
  }

  #loader.hidden { opacity: 0; pointer-events: none; }

  .loader-spinner {
    width: 40px; height: 40px;
    border: 1.5px solid rgba(255,255,255,0.15);
    border-top-color: rgba(255,255,255,0.7);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loader-text {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: 14px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
  }

  #loader-count {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.25);
  }

  /* ── ERROR SCREEN ── */
  #error-screen {
    display: none;
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    z-index: 99;
  }

  #error-screen.visible { display: flex; }

  .error-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 300;
    color: rgba(255,255,255,0.7);
    letter-spacing: 0.05em;
  }

  .error-msg {
    font-family: 'Raleway', sans-serif;
    font-weight: 200;
    font-size: 14px;
    color: rgba(255,255,255,0.35);
    letter-spacing: 0.1em;
    max-width: 500px;
    text-align: center;
    line-height: 1.8;
  }
</style>
</head>
<body>

<div id="loader">
  <div class="loader-spinner"></div>
  <div class="loader-text">Loading photos…</div>
  <div id="loader-count"></div>
</div>

<div id="error-screen">
  <div class="error-title">Could not load photos</div>
  <div class="error-msg" id="error-msg"></div>
</div>

<!-- Edit or delete venue name -->
<div id="venue-name">The Siosons</div>

<div id="slideshow"></div>
<div id="dots"></div>
<div id="counter"></div>
<div id="progress-bar"></div>

<script>
  // ── CONFIG ─────────────────────────────────────────────
  const API_KEY        = 'AIzaSyBc3U4iVVJI4wsYJbGAw7Zr_RGYAtHIhMc';
  const FOLDER_ID      = '1BKcnTAxXnew0i0WgQlZy0dgC-21rdUnv';
  const SLIDE_DURATION = 8000;
  const FADE_DURATION  = 1200;
  const SHUFFLE        = true;
  // ───────────────────────────────────────────────────────

  const slideshowEl = document.getElementById('slideshow');
  const dotsEl      = document.getElementById('dots');
  const barEl       = document.getElementById('progress-bar');
  const counterEl   = document.getElementById('counter');
  const loaderEl    = document.getElementById('loader');
  const loaderCount = document.getElementById('loader-count');
  const errorEl     = document.getElementById('error-screen');

  let slides  = [];
  let current = 0;
  let timer;

  // ── FETCH ALL PAGES FROM GOOGLE DRIVE ──────────────────
  async function fetchAllDriveImages() {
    const all = [];
    let pageToken = null;

    do {
      const tokenParam = pageToken ? `&pageToken=${encodeURIComponent(pageToken)}` : '';
      const url = `https://www.googleapis.com/drive/v3/files`
        + `?q=${encodeURIComponent(`'${FOLDER_ID}' in parents and mimeType contains 'image/'`)}`
        + `&fields=nextPageToken,files(id,name,mimeType)`
        + `&pageSize=100`
        + `&key=${API_KEY}`
        + tokenParam;

      const res = await fetch(url);
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err?.error?.message || `Drive API error ${res.status}`);
      }
      const data = await res.json();
      const images = (data.files || []).filter(f => f.mimeType.startsWith('image/'));
      all.push(...images);
      loaderCount.textContent = `${all.length} photos found…`;
      pageToken = data.nextPageToken || null;
    } while (pageToken);

    if (all.length === 0) throw new Error('No images found in the folder.');
    return all;
  }

  // ── IMAGE URL (HEIC-safe via Google's image server) ────
  function imageUrl(fileId) {
    return `https://lh3.googleusercontent.com/d/${fileId}=w1920`;
  }

  // ── BUILD SLIDES ────────────────────────────────────────
  function buildSlides(files) {
    if (SHUFFLE) files = files.sort(() => Math.random() - 0.5);

    files.forEach((file, i) => {
      const url = imageUrl(file.id);

      const div = document.createElement('div');
      div.className = 'slide';

      // Blurred background — same image, CSS blurred
      const bg = document.createElement('div');
      bg.className = 'slide-bg';
      bg.style.backgroundImage = `url('${url}')`;

      // Foreground — full contained image
      const fg = document.createElement('div');
      fg.className = 'slide-img';

      const img = document.createElement('img');
      img.src = url;
      img.alt = `Slide ${i + 1}`;
      img.onerror = () => { div.style.display = 'none'; };

      fg.appendChild(img);
      div.appendChild(bg);
      div.appendChild(fg);
      slideshowEl.appendChild(div);
    });

    slides = Array.from(document.querySelectorAll('.slide'));
  }

  // ── BUILD DOTS ──────────────────────────────────────────
  function buildDots() {
    dotsEl.innerHTML = '';
    if (slides.length <= 30) {
      slides.forEach((_, i) => {
        const d = document.createElement('div');
        d.className = 'dot' + (i === 0 ? ' active' : '');
        dotsEl.appendChild(d);
      });
    }
  }

  // ── SHOW SLIDE ──────────────────────────────────────────
  function showSlide(index) {
    const prev = current;
    current = ((index % slides.length) + slides.length) % slides.length;

    slides[prev].classList.remove('active');
    slides[prev].classList.add('previous');
    slides[current].classList.add('active');
    setTimeout(() => slides[prev].classList.remove('previous'), FADE_DURATION + 50);

    const dots = Array.from(dotsEl.querySelectorAll('.dot'));
    dots[prev]?.classList.remove('active');
    dots[current]?.classList.add('active');

    counterEl.textContent = (current + 1) + ' / ' + slides.length;

    barEl.style.transition = 'none';
    barEl.style.width = '0%';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      barEl.style.transition = `width ${SLIDE_DURATION}ms linear`;
      barEl.style.width = '100%';
    }));
  }

  function next() { showSlide(current + 1); }

  function startTimer() {
    clearInterval(timer);
    timer = setInterval(next, SLIDE_DURATION);
  }

  function preloadAhead() {
    const nextIdx = (current + 1) % slides.length;
    const img = slides[nextIdx]?.querySelector('img');
    if (img && !img.complete) { const p = new Image(); p.src = img.src; }
  }

  // ── INIT ────────────────────────────────────────────────
  async function init() {
    try {
      const files = await fetchAllDriveImages();
      buildSlides(files);
      buildDots();

      slides[0].classList.add('active');
      counterEl.textContent = '1 / ' + slides.length;

      requestAnimationFrame(() => requestAnimationFrame(() => {
        barEl.style.transition = `width ${SLIDE_DURATION}ms linear`;
        barEl.style.width = '100%';
      }));

      loaderEl.classList.add('hidden');
      setTimeout(() => loaderEl.style.display = 'none', 900);

      startTimer();
      setInterval(preloadAhead, 3000);

    } catch (err) {
      loaderEl.classList.add('hidden');
      setTimeout(() => loaderEl.style.display = 'none', 900);
      errorEl.classList.add('visible');
      document.getElementById('error-msg').textContent = err.message;
      console.error(err);
    }
  }

  init();

  // ── KEYBOARD ────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') { next(); startTimer(); }
    if (e.key === 'ArrowLeft') { showSlide(current - 1); startTimer(); }
    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  });

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  }

  document.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
  }, { once: true });
</script>
</body>
</html>
